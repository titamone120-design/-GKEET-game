name: Build GKEET Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Bundle Three.js for offline 3D gameplay
        run: mkdir -p www/vendor && cp node_modules/three/build/three.min.js www/vendor/three.min.js
      - name: Install Chromium for gameplay tests
        run: npx playwright install --with-deps chromium

      - name: Run GKEET browser gameplay smoke test
        run: npm run test:smoke

      - name: Validate game JavaScript syntax
        run: node -e "const fs=require('fs');const h=fs.readFileSync('www/index.html','utf8');const scripts=[...h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());scripts.forEach(s=>new Function(s));console.log('Game JavaScript syntax OK')"
      - name: Add Android platform
        run: npx cap add android
      - name: Set fighting game to landscape orientation
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GKEET-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

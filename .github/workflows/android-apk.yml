name: GKEET Gameplay Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Bundle Three.js for offline 3D gameplay
        run: mkdir -p www/vendor && cp node_modules/three/build/three.min.js www/vendor/three.min.js
      - name: Install Chromium for gameplay tests
        run: npx playwright install --with-deps chromium

      - name: Run GKEET browser gameplay smoke test
        run: npm run test:smoke

      - name: Upload gameplay screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GKEET-Gameplay-Screenshot
          path: /tmp/gkeet-gameplay.png
          if-no-files-found: ignore

      - name: Validate game JavaScript syntax
        run: node -e "const fs=require('fs');for(const f of ['www/index.html','www/shooter.html']){const h=fs.readFileSync(f,'utf8');for(const m of h.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)){if(m[1].trim())new Function(m[1])}console.log(f+' syntax OK')}"

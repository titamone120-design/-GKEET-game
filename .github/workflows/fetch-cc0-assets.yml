name: Fetch CC0 3D Fighter Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC0 humanoid GLB pack
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/Kinemiq/free-game-animations/releases/download/v1.0/KinemIQ_Free_Animations_CC0_GLB.zip" \
            -o /tmp/gkeet-cc0-pack.zip
          mkdir -p /tmp/gkeet-cc0-assets
          unzip -q /tmp/gkeet-cc0-pack.zip -d /tmp/gkeet-cc0-assets
          echo "Downloaded asset files:"
          find /tmp/gkeet-cc0-assets -maxdepth 4 -type f -printf '%p %s bytes\n'
          echo "Archive integrity:"
          unzip -t /tmp/gkeet-cc0-pack.zip

      - name: Upload CC0 model and animation pack
        uses: actions/upload-artifact@v4
        with:
          name: GKEET-CC0-3D-Assets
          path: /tmp/gkeet-cc0-assets
          if-no-files-found: error
